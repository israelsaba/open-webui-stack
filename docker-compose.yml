name: open-webui-suite

networks:
  open-webui-net:
    name: open-webui-net
    driver: bridge

volumes:
  open-webui:
    external: ${IS_EXTERNAL_OI_VOLUME:-false}

services:
  sdk-interface:
    profiles: []
    build:
      context: .
      dockerfile: ./sdk-interface/Dockerfile
    container_name: sdk-interface
    volumes:
      - ./sdk-interface:/app
      - ./sdk-interface/data:/data
    env_file:
      - path: .env
        required: true
    environment:
      HOST: "0.0.0.0"
      PORT: ${SDK_PORT:-8060}
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PYTHONPATH: "/app"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8060/health')",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - open-webui-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: open-webui
    ports:
      - "8090:8080"
    env_file:
      - .env
    environment:
      AUDIO_STT_ENGINE: "openai"
      RAG_EMBEDDING_ENGINE: "openai"
      OPENAI_API_BASE_URLS: "${OPENAI_API_BASE_URLS:-http://sdk-interface:8060/v1}"
      OPENAI_API_KEYS: "${OPENAI_API_KEYS:-}"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      sdk-interface:
        condition: service_healthy
    networks:
      - open-webui-net
