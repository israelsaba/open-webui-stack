name: PR Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk-interface
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      
      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.12"
      
      - name: Install ruff
        run: pip install ruff==0.8.4 --quiet
      
      - name: Run ruff
        run: ruff check app tests --output-format=github

  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./sdk-interface
    
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.5.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'sdk-interface/requirements-test.lock'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements-test.lock --quiet
      
      - name: Run tests with coverage
        env:
          SDK__TEST_MODE: mock
        run: |
          # Tests run in mock mode - all provider APIs are mocked
          # This allows full test coverage without real API keys
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -m "not slow"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./sdk-interface/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4.5.0
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: sdk-interface/htmlcov/
          retention-days: 7
      
      # Disabled: Coverage comment action has path resolution issues
      # Coverage is still uploaded to Codecov and artifact
